name: pull_request

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  complete:
    if: always()
    needs: [fmt, build-and-test]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - run: rustup toolchain install 1.81 --profile minimal --component rustfmt
    - run: cargo +1.81 fmt --all --check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: stellar/actions/rust-cache@f119d3f8ebd555a448ce63be0aeae625d1b310a1
    - run: rustup toolchain install 1.81 --profile minimal --target wasm32-unknown-unknown
    - uses: stellar/stellar-cli@f4fd838380408dcad3e39f704e8d56d6408c63e2 # v22.6.0
      with:
        version: 22.6.0
    - run: make test