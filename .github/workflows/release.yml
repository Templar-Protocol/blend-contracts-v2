name: release

# Builds every release WASM with the toolchains the audit evidence pins and
# publishes them as ONE GitHub release for the tag. It never overwrites: if the
# tag already has a release, the job only checks that the rebuilt bytes match
# that release's SHA256SUMS. A new release is created as a draft for a human to
# review and publish. Nothing is sent to any explorer or network.
#
# Re-check an existing release: Actions -> release -> Run workflow, tag=v0.1.0.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  blend:
    name: pool, backstop, pool_factory (Rust 1.98.0, Stellar CLI 28.1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # Installs 1.98.0 + wasm32v1-none from rust-toolchain.toml.
      - run: rustup toolchain install && rustc --version | grep -q '^rustc 1\.98\.0'
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: 28.1.0
      - run: make build
      - run: |
          mkdir out
          cp target/wasm32v1-none/optimized/{pool,backstop,pool_factory}.wasm out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blend
          path: out/*.wasm
          if-no-files-found: error

  adapter:
    name: pool_oracle_adapter (Rust 1.98.0, Stellar CLI 28.1.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pool-oracle-adapter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # Installs 1.98.0 + wasm32v1-none from the root rust-toolchain.toml
      # (adapter is a workspace member; rustup walks up from this directory).
      - run: rustup toolchain install && rustc --version | grep -q '^rustc 1\.98\.0'
      - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
        with:
          tool: just
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: 28.1.0
      # Same CI shim as pool-oracle-adapter.yml: the default toolchain is already 1.98.0.
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec "$@"\n' > "$RUNNER_TEMP/bin/pool-adapter-env"
          chmod +x "$RUNNER_TEMP/bin/pool-adapter-env"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: just optimize
      - run: |
          mkdir ../out
          cp target/wasm32v1-none/release-soroban-checked/pool_oracle_adapter.optimized.wasm ../out/pool_oracle_adapter.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adapter
          path: out/*.wasm
          if-no-files-found: error

  release:
    needs: [blend, adapter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - working-directory: out
        run: sha256sum *.wasm | tee SHA256SUMS
      - name: Verify against the existing release, or create a draft
        working-directory: out
        run: |
          if lookup=$(gh release view "$TAG" 2>&1); then
            gh release download "$TAG" -p SHA256SUMS -O published.SHA256SUMS
            diff -u published.SHA256SUMS SHA256SUMS
            echo "Rebuilt WASMs match the published $TAG release."
          elif [[ "$lookup" == *"release not found"* ]]; then
            commit=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes "Built by the release workflow from $TAG ($commit). Edit these notes before publishing." \
              *.wasm SHA256SUMS
          else
            echo "$lookup" >&2
            exit 1
          fi
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/*.wasm
