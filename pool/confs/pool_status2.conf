{
	"build_script": "../certora_build.py",
	"optimistic_loop": true,
	"precise_bitwise_ops": true,
	"process": "emv",
	"prover_args": [
		"-s z3",
		"-split false",
		"-splitParallel true",
		"-dontStopAtFirstSplitTimeout true",
	],
    "smt_timeout": "7200",
	"prover_version": "master",
	"rule": [
		"verify_update_status_0_a",
		"verify_update_status_0_b"
	],
	"rule_sanity": "basic",
	"server": "production"
}