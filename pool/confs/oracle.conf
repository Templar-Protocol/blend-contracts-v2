{
    "build_script": "./certora_build.py",
    "optimistic_loop": true,
    "precise_bitwise_ops": true,
    "rule_sanity": "basic",
    "rule": [
        "price_accepted_implies_quote_acceptable",
        "missing_price_panics",
        "non_positive_price_panics",
        "future_dated_price_panics",
        "stale_price_panics",
        "wrong_decimals_panics",
        "sanity_acceptable_quote_reachable",
        "sanity_missing_price_reachable",
        "sanity_non_positive_price_reachable",
        "sanity_future_dated_reachable",
        "sanity_stale_price_reachable",
        "sanity_wrong_decimals_reachable",
        "sanity_price_load_can_succeed"
    ],
    "server": "production",
    "prover_version": "master",
    "global_timeout": "1800"
}
