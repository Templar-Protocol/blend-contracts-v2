{
    "build_script": "./certora_build.py",
    "optimistic_loop": true,
    "precise_bitwise_ops": true,
    "rule_sanity": "basic",
    "rule": [
        "utilization_in_range",
        "utilization_above_max_panics",
        "utilization_below_max_accepted_implies_within",
        "utilization_at_100_panics",
        "utilization_below_100_accepted_implies_below",
        "sanity_utilization_above_max_reachable",
        "sanity_utilization_at_100_reachable",
        "sanity_utilization_below_max_reachable",
        "sanity_utilization_below_100_reachable",
        "sanity_utilization_strictly_between"
    ],
    "server": "production",
    "prover_version": "master",
    "global_timeout": "1800"
}
