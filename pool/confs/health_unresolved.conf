{
    "build_script": "./certora_build.py",
    "optimistic_loop": true,
    "precise_bitwise_ops": false,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "rule": [
        "user_health_execute_submit_with_flash_loan",
        "build_actions_from_request"
    ],
    "server": "production",
    "prover_version": "master",
    "global_timeout": "7200",
    "smt_timeout": "7200",
    "prover_args": [
        "-splitParallel true",
        "-dontStopAtFirstSplitTimeout true"
    ]
}
