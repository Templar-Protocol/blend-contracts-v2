{
    "build_script": "./certora_build.py",
    "optimistic_loop": true,
    "precise_bitwise_ops": true,
    "loop_iter": "2",
    "rule_sanity": "basic",
    "rule": [
        "supply_cap_enforced_on_supply",
        "supply_cap_enforced_on_supply_collateral",
        "sanity_supply_can_succeed",
        "sanity_supply_collateral_can_succeed"
    ],
    "server": "production",
    "prover_version": "master",
    "global_timeout": "1800",
    "prover_args": [
        "-splitParallel true",
        "-dontStopAtFirstSplitTimeout true"
    ]
}
