[workspace]
resolver = "2"

members = [
    "backstop",
    "pool",
    "mocks/mock-pool",
    "mocks/mock-pool-factory",
    "mocks/moderc3156",
    "pool-factory",
    "test-suites"
]

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.release]
opt-level = "z"
overflow-checks = true # DEV: Do not remove this check - doing so will create vulnerabilities
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies.soroban-sdk]
version = "22.0.7"

[workspace.dependencies.soroban-fixed-point-math]
version = "1.3.0"

[workspace.dependencies.cast]
version = "0.3.0"
default-features = false

[workspace.dependencies.sep-40-oracle]
version = "1.2.0"

[workspace.dependencies.sep-41-token]
version = "1.2.0"

[workspace.dependencies.blend-contract-sdk]
version = "1.22.0"

[workspace.dependencies.moderc3156]
git = "https://github.com/xycloo/xycloans"
rev = "d9a7ae1"

[workspace.dependencies.cvlr]
git = "https://github.com/Certora/cvlr.git"
# Pinned to the revisions behind the June 2025 Certora FV report. Later cvlr
# requires soroban-sdk 26, which this workspace does not use.
rev = "919957b622d8ebb5e2e0430a6df9ea1e470f00d7"
default-features = false

[workspace.dependencies.cvlr-soroban]
git = "https://github.com/Certora/cvlr-soroban.git"
rev = "69a49e15c496b695cd15a01bb06d811294d0f954"

[workspace.dependencies.cvlr-soroban-macros]
git = "https://github.com/Certora/cvlr-soroban.git"
rev = "69a49e15c496b695cd15a01bb06d811294d0f954"

[workspace.dependencies.cvlr-soroban-derive]
git = "https://github.com/Certora/cvlr-soroban.git"
rev = "69a49e15c496b695cd15a01bb06d811294d0f954"

